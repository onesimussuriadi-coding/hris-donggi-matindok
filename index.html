<script>
        let employeesData = [];

        // Ambil data dari employee_data.json
        fetch('employee_data.json')
            .then(res => res.json())
            .then(data => {
                employeesData = data;
                renderTable(employeesData);
            })
            .catch(err => {
                console.error("Gagal memuat data:", err);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">Gagal memuat file employee_data.json.</td></tr>`;
            });

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach((emp, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-4 font-medium">${emp.No || (index + 1)}</td>
                    <td class="p-4 font-semibold text-slate-900">${emp.TAD || emp.nama || '-'}</td>
                    <td class="p-4">${emp['Job Title'] || emp.jabatan || '-'}</td>
                    <td class="p-4"><span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-medium">${emp.Division || emp.divisi || '-'}</span></td>
                    <td class="p-4">${emp.Location || emp.lokasi || '-'}</td>
                    <td class="p-4">${emp['Nama Kontraktor'] || 'PT. Banggai Sentral Sulawesi'}</td>
                    <td class="p-4 text-center">
                        <button onclick='showDetail(${JSON.stringify(emp)})' class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-xl text-xs font-medium transition">Detail</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('total-karyawan').innerText = `${data.length} Orang`;
        }

        function filterTable() {
            const keyword = document.getElementById('searchBox').value.toLowerCase();
            const filtered = employeesData.filter(emp => {
                const name = (emp.TAD || emp.nama || '').toLowerCase();
                const job = (emp['Job Title'] || emp.jabatan || '').toLowerCase();
                return name.includes(keyword) || job.includes(keyword);
            });
            renderTable(filtered);
        }

        function showDetail(emp) {
            document.getElementById('modalName').innerText = emp.TAD || emp.nama || 'Detail Karyawan';
            const content = document.getElementById('modalContent');
            content.innerHTML = '';

            for (const [key, value] of Object.entries(emp)) {
                if (value !== null && value !== "") {
                    const div = document.createElement('div');
                    div.className = "p-3 bg-slate-50 rounded-xl border border-slate-100";
                    div.innerHTML = `<span class="block text-xs font-semibold text-slate-400 uppercase">${key}</span><span class="text-slate-800 font-medium">${value}</span>`;
                    content.appendChild(div);
                }
            }
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('flex');
            document.getElementById('detailModal').classList.add('hidden');
        }

        // Fitur Export ke CSV / Excel Lengkap 67 Kolom
        function exportToCSV() {
            if (employeesData.length === 0) {
                alert("Tidak ada data untuk diexport!");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            const keys = Object.keys(employeesData[0]);
            csvContent += keys.join(",") + "\r\n";

            employeesData.forEach(emp => {
                let row = keys.map(key => `"${emp[key] !== undefined && emp[key] !== null ? emp[key] : ''}"`);
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Master_Karyawan_Donggi_Matindok_Lengkap.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
