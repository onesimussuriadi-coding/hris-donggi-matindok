<!-- REKAPITULASI DISTRIBUSI KEHADIRAN PERIODE (DENGAN TUNJANGAN MAKAN LEMBUR) -->
<div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4 mb-4">
    <h4 class="font-bold text-slate-800 mb-3 text-xs">📊 REKAPITULASI DISTRIBUSI KEHADIRAN PERIODE</h4>
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">Total HK</div>
            <div id="rekapDistTotalHK" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">Shift Siang</div>
            <div id="rekapDistSiang" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">Shift Malam</div>
            <div id="rekapDistMalam" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
        <!-- KOTAK RUJUKAN TUNJANGAN MAKAN LEMBUR (DITAMBAHKAN SEJAJAR DI SEBELAH SHIFT MALAM) -->
        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center">
            <div class="text-xs text-blue-600 font-semibold mb-1">Tunjangan Makan Lembur</div>
            <div id="rekapDistMakanLembur" class="text-base font-bold text-blue-700">0 Kali</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">Cuti Resmi</div>
            <div id="rekapDistCuti" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">OFF Murni</div>
            <div id="rekapDistOff" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
            <div class="text-xs text-slate-500 font-semibold mb-1">Sakit/Izin/Alfa</div>
            <div id="rekapDistLainnya" class="text-base font-bold text-slate-800">0 Hari</div>
        </div>
    </div>
</div>
