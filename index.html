<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS Dashboard - Zona 13 Field Donggi Matindok</title>
    <!-- Tailwind CSS untuk styling cepat dan rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header Utama -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6">
        <h1 class="text-2xl font-bold">HRIS - Zona 13 Field Donggi Matindok</h1>
        <p class="text-sm text-blue-200">Sistem Manajemen Data Tenaga Alih Daya (TAD) & Pengupahan</p>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto p-6">
        
        <!-- Panel Kontrol / Pencarian -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <input type="text" id="searchInput" placeholder="Cari nama karyawan atau jabatan..." 
                class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                    Muat Ulang Data
                </button>
            </div>
        </div>

        <!-- Tabel Data Karyawan -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-blue-50 text-blue-900 border-b text-sm">
                            <th class="p-3">No</th>
                            <th class="p-3">Nama Karyawan</th>
                            <th class="p-3">Jabatan</th>
                            <th class="p-3">Penempatan</th>
                            <th class="p-3">Sistem Kerja</th>
                            <th class="p-3">Grade</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <!-- Data baris tabel akan dimasukkan secara dinamis melalui script.js -->
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-500">Memuat data dari sistem...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Panggil file logika JavaScript dari direktori scripts -->
    <script src="scripts/script.js"></script>
</body>
</html>
