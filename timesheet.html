<script>
async function loadData() {
    // ID Spreadsheet Anda
    const id = "1DvRQrgT43ycmJ_h5cBCYy5Fijk3oFG9L18p-k42cdpo";
    const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`;
    
    const res = await fetch(url);
    const data = await res.json();
    const rows = data.table.rows;
    
    let html = "";
    // Membaca baris 5 s.d 56 (indeks 4 s.d 55)
    for(let i=4; i<56; i++) {
        let r = rows[i].c;
        if(r[1]) html += `<tr>
            <td class="p-2 border">${r[1].v}</td>
            <td class="p-2 border">${r[2].v}</td>
            <td class="p-2 border">${r[19]?.v || 0}</td>
            <td class="p-2 border">${r[32]?.v || 0}</td>
        </tr>`;
    }
    document.getElementById("tabel").innerHTML = html;
}
loadData();
</script>
<table id="tabel" class="w-full border"></table>
