<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Time Sheet & Absen - Portal HRIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header & Stats -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Time Sheet & Absen - Live Data</h1>
            <button onclick="loadData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">🔄 Update Data</button>
        </div>

        <!-- Tabel Profesional -->
        <div class="bg-white shadow rounded-2xl overflow-hidden border border-slate-200">
            <table class="w-full text-left">
                <thead class="bg-slate-800 text-white text-xs uppercase">
                    <tr>
                        <th class="px-6 py-4">No</th>
                        <th class="px-6 py-4">Nama Karyawan</th>
                        <th class="px-6 py-4 text-center">Hari Kerja (T)</th>
                        <th class="px-6 py-4 text-center">Jam Lembur (AG)</th>
                    </tr>
                </thead>
                <tbody id="tabel" class="divide-y divide-slate-100 text-sm">
                    <tr><td colspan="4" class="p-8 text-center text-slate-500 italic">Menghubungkan ke Google Sheet...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    async function loadData() {
        // ID Google Sheet yang sudah di-Publish
        const id = "1DvRQrgT43ycmJ_h5cBCYy5Fijk3oFG9L18p-k42cdpo";
        const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`;
        
        try {
            const res = await fetch(url);
            const text = await res.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            
            let html = "";
            // Mapping yang benar: baris 5 ke bawah adalah data (indeks 4)
            for(let i = 4; i < rows.length; i++) {
                let r = rows[i].c;
                if(r && r[1]) { // Pastikan kolom No (B) ada
                    html += `<tr class="hover:bg-slate-50">
                        <td class="px-6 py-3">${r[1]?.v || ''}</td>
                        <td class="px-6 py-3 font-semibold">${r[2]?.v || ''}</td>
                        <td class="px-6 py-3 text-center text-emerald-600 font-bold">${r[19]?.v || 0}</td>
                        <td class="px-6 py-3 text-center text-blue-600 font-bold">${r[32]?.v || 0}</td>
                    </tr>`;
                }
            }
            document.getElementById("tabel").innerHTML = html;
        } catch (e) {
            document.getElementById("tabel").innerHTML = "<tr><td colspan='4' class='p-8 text-center text-red-500'>Gagal sinkron. Pastikan sheet di-Publish ke Web.</td></tr>";
        }
    }
    loadData();
    </script>
</body>
</html>
