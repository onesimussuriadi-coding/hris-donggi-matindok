<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HRIS Portal - Time Sheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 flex h-screen">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-[#0B132B] text-white p-6 shrink-0">
        <h1 class="text-lg font-bold mb-8">HRIS Portal</h1>
        <nav class="space-y-4">
            <div class="opacity-50">Dashboard Utama</div>
            <div class="font-bold text-blue-400 border-l-4 border-blue-400 pl-4">Time Sheet & Absen</div>
        </nav>
    </aside>

    <!-- Konten -->
    <main class="flex-1 p-8 overflow-y-auto">
        <h2 class="text-2xl font-bold mb-6">Dashboard Time Sheet & Absen</h2>
        
        <!-- Tabel Utama -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
            <table class="w-full text-left">
                <thead class="bg-emerald-800 text-white text-xs uppercase">
                    <tr>
                        <th class="p-4">No</th>
                        <th class="p-4">Nama Pekerja</th>
                        <th class="p-4">Jabatan & Sistem</th>
                        <th class="p-4">Total Lembur</th>
                        <th class="p-4">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelData" class="divide-y divide-slate-100">
                    <tr><td colspan="5" class="p-8 text-center">Memuat data real-time...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Script Integrasi Real-Time -->
    <script>
    async function loadData() {
        const id = "1DvRQrgT43ycmJ_h5cBCYy5Fijk3oFG9L18p-k42cdpo";
        const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json`;
        try {
            const res = await fetch(url);
            const json = JSON.parse((await res.text()).substring(47, 47 + (await res.text()).length - 51));
            const rows = json.table.rows;
            let html = "";
            for(let i=4; i<rows.length; i++) {
                let r = rows[i].c;
                if(r && r[2]) {
                    html += `<tr>
                        <td class="p-4">${r[1]?.v || ''}</td>
                        <td class="p-4 font-bold">${r[2]?.v || ''}</td>
                        <td class="p-4">${r[5]?.v || ''} <span class="text-xs bg-slate-100 px-2 py-1 rounded">${r[6]?.v || ''}</span></td>
                        <td class="p-4 font-bold text-blue-700">${r[32]?.v || 0} Jam</td>
                        <td class="p-4"><button class="bg-emerald-700 text-white px-3 py-1 rounded text-xs">Rekap & Rincian</button></td>
                    </tr>`;
                }
            }
            document.getElementById("tabelData").innerHTML = html;
        } catch (e) {
            document.getElementById("tabelData").innerHTML = "<tr><td colspan='5' class='p-8 text-center text-red-500'>Gagal sinkron. Pastikan Publish to Web aktif.</td></tr>";
        }
    }
    window.onload = loadData;
    </script>
</body>
</html>
